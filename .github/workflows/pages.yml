name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Siapkan isi situs (bongkar file biner dari base64)
        run: |
          mkdir -p _site
          cp README.md _site/
          for f in b64/*.gz.b64; do
            n=$(basename "$f" .gz.b64)
            base64 -d "$f" | gunzip > "_site/$n"
          done
          test -s _site/index.html
          ls -la _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
